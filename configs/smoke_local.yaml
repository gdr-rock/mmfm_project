dataset:
  videos_root: "/home/USER/datasets/crosstask/videos"
  subset_size: 1
  seed: 42
  include_video_ids_file: "configs/video_ids_example.txt"
  video_extensions: [".mp4", ".webm", ".mkv", ".avi"]

features:
  temporal_item_seconds: 2.0
  frame_sample_per_item: 2
  encoder_name: "timm/PE-Core-B-16"

segmentation:
  min_caption_seconds: 2.0

caption:
  model_name: "facebook/Perception-LM-3B"
  fallback_model_name: null
  max_new_tokens: 32
  max_frames_per_segment: 4

output:
  output_root: "./output"
